<!DOCTYPE html>
<html>
<head>
    <title>Even Odd Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f2f2f2;
        }

        .container {
            background: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            padding: 10px;
            width: 200px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            margin-top: 15px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Even and Odd Number Checker</h2>

    <input type="number" id="number" placeholder="Enter a number">

    <br>

    <button onclick="checkNumber()">Check</button>

    <p id="result"></p>
</div>


<script>
    function checkNumber() {

        let num = document.getElementById("number").value;
        let result = document.getElementById("result");

        // if-else condition to check even or odd
        if (num % 2 == 0) {
            result.innerHTML = num + " is an Even Number";
        }
        else {
            result.innerHTML = num + " is an Odd Number";
        }
    }
</script>

</body>
</html>
